<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E3A8A" />
    <script>
      (function() {
        try {
          var cached = localStorage.getItem("brand_design_system");
          if (cached) {
            var design = JSON.parse(cached);
            if (design && design.colors) {
              function hexToHsl(hex) {
                if (!hex) return "0 0% 0%";
                hex = hex.replace(/^#/, "");
                if (hex.length === 3) hex = hex.split("").map(function(c) { return c + c; }).join("");
                if (hex.length !== 6) return "0 0% 0%";
                var r = parseInt(hex.substring(0, 2), 16) / 255;
                var g = parseInt(hex.substring(2, 4), 16) / 255;
                var b = parseInt(hex.substring(4, 6), 16) / 255;
                var max = Math.max(r, g, b), min = Math.min(r, g, b);
                var h = 0, s = 0, l = (max + min) / 2;
                if (max !== min) {
                  var d = max - min;
                  s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                  switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                  }
                  h /= 6;
                }
                return Math.round(h * 360) + " " + Math.round(s * 100) + "% " + Math.round(l * 100) + "%";
              }
              var light = design.colors;
              var dark = design.dark_mode_colors || light;
               function gen(c) {
                 return "--primary: " + hexToHsl(c.primary) + ";" +
                        "--secondary: " + hexToHsl(c.secondary) + ";" +
                        "--accent: " + hexToHsl(c.accent) + ";" +
                        "--background: " + hexToHsl(c.background) + ";" +
                        "--foreground: " + hexToHsl(c.foreground) + ";" +
                        "--card: " + hexToHsl(c.card || c.background || "#FFFFFF") + ";" +
                        "--card-foreground: " + hexToHsl(c.card_foreground || c.foreground || "#0F1626") + ";" +
                        "--popover: " + hexToHsl(c.popover || c.background || "#FFFFFF") + ";" +
                        "--popover-foreground: " + hexToHsl(c.popover_foreground || c.foreground || "#0F1626") + ";" +
                        "--surface: " + hexToHsl(c.surface || "#F8FAFC") + ";" +
                        "--surface-hover: " + hexToHsl(c.surface_hover || "#F1F5F9") + ";" +
                        "--muted: " + hexToHsl(c.muted || "#F1F5F9") + ";" +
                        "--muted-foreground: " + hexToHsl(c.muted_foreground || "#64748B") + ";" +
                        "--border: " + hexToHsl(c.border || "#E2E8F0") + ";" +
                        "--input: " + hexToHsl(c.input || "#E2E8F0") + ";" +
                        "--success: " + hexToHsl(c.success || "#10B981") + ";" +
                        "--warning: " + hexToHsl(c.warning || "#F59E0B") + ";" +
                        "--error: " + hexToHsl(c.error || "#EF4444") + ";" +
                        "--info: " + hexToHsl(c.info || c.primary) + ";" +
                        "--ring: " + hexToHsl(c.primary) + ";" +
                        "--sidebar-background: " + hexToHsl(c.background) + ";" +
                        "--sidebar-foreground: " + hexToHsl(c.foreground) + ";" +
                        "--sidebar-primary: " + hexToHsl(c.primary) + ";" +
                        "--sidebar-primary-foreground: " + hexToHsl("#FFFFFF") + ";" +
                        "--sidebar-accent: " + hexToHsl(c.muted || "#F1F5F9") + ";" +
                        "--sidebar-accent-foreground: " + hexToHsl(c.foreground) + ";" +
                        "--sidebar-border: " + hexToHsl(c.border || "#E2E8F0") + ";" +
                        "--sidebar-ring: " + hexToHsl(c.primary) + ";";
               }
               var style = document.createElement("style");
               style.id = "theme-engine";
               style.textContent = "html:root { " + gen(light) + (design.radius ? "--radius: " + design.radius + ";" : "") + " } html.dark { " + gen(dark) + " }";
              var seoCached = localStorage.getItem("brand_seo_system");
              if (seoCached) {
                var seo = JSON.parse(seoCached);
                if (seo.meta_title) document.title = seo.meta_title;
                var metaDesc = document.querySelector('meta[name="description"]');
                if (metaDesc && seo.meta_description) metaDesc.content = seo.meta_description;
              }
            }
          }
        } catch(e) {}
      })();
    </script>

    <!-- Primary SEO -->
    <title>Premium Banking & Wealth Management</title>
    <meta name="description" content="Secure digital banking and asset management for individuals, families, and businesses." />
    <meta name="author" content="Financial Institution" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/logo.png" />

    <!--
      Google Fonts: preconnect first for DNS resolution,
      then load with display=swap to prevent render-blocking.
      Only load the weights we actually use.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Load fonts asynchronously via media="print" trick, then swap to all.
      This completely removes the render-blocking font request.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback for no-JS -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
      />
    </noscript>

    <!--
      Preload the LCP hero image so the browser discovers it
      before the JS parses and renders the React tree.
    -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=75&w=1400&auto=format&fit=crop&fm=webp"
      imagesrcset="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=75&w=800&auto=format&fit=crop&fm=webp 800w, https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=75&w=1400&auto=format&fit=crop&fm=webp 1400w"
      imagesizes="(max-width: 1024px) 100vw, 60vw"
    />

    <!-- DNS prefetch for Supabase -->
    <link rel="dns-prefetch" href="https://supabase.co" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker after page load to avoid blocking initial render
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // SW registration failure is non-fatal — silently ignore
          });
        });
      }
    </script>
  </body>
</html>
